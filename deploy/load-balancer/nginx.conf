worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # Shared by all Nginx workers on this load balancer.
  limit_req_zone $binary_remote_addr zone=login_by_ip:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=registration_by_ip:10m rate=2r/m;
  limit_req_status 429;

  upstream attendance_api {
    least_conn;
    server api1:5000 max_fails=2 fail_timeout=10s;
    server api2:5000 max_fails=2 fail_timeout=10s;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 128k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location = /api/auth/login {
      limit_req zone=login_by_ip burst=5 nodelay;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_pass http://attendance_api;
    }

    location = /api/auth/company-register {
      limit_req zone=registration_by_ip burst=2 nodelay;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_pass http://attendance_api;
    }

    location /api/ {
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_pass http://attendance_api;
    }

    location / {
      return 404;
    }
  }
}
