services:
  api1:
    build:
      context: ../../backend
    env_file:
      - .env.docker
    environment:
      PORT: "5000"
      TRUST_PROXY_HOPS: "1"
    restart: unless-stopped
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 30s
    networks: [app]

  api2:
    build:
      context: ../../backend
    env_file:
      - .env.docker
    environment:
      PORT: "5000"
      TRUST_PROXY_HOPS: "1"
    restart: unless-stopped
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 30s
    networks: [app]

  load-balancer:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/api/health"]
      interval: 15s
      timeout: 4s
      retries: 3
    networks: [app]

networks:
  app:
    driver: bridge
